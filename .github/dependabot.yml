version: 2
updates:
  # Python dependencies, read from pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for routine dev-tool bumps instead of one per tool.
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*"]
    open-pull-requests-limit: 5

  # Actions pinned in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
