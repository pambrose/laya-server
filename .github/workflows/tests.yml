name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the checkpoint-backed suite keeps exercising the real model
    # even in quiet weeks.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes to the repository, issues or packages.
permissions:
  contents: read

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes, so the token need not outlive the checkout step.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is stale, so CI also guards the lockfile.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
          uv run python scripts/toc.py --check

      - name: Mypy
        run: uv run mypy

      # Security audit of these workflows and dependabot.yml. The token turns on
      # zizmor's online audits (impostor commits, known-vulnerable actions).
      - name: Zizmor
        run: uv run zizmor .github/
        env:
          GH_TOKEN: ${{ github.token }}

  fast:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject's requires-python claims to support.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes, so the token need not outlive the checkout step.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Through env rather than `${{ }}` in the script, so no expression is
      # ever expanded into shell source.
      - name: Install dependencies
        run: uv sync --locked --python "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python "$PYTHON_VERSION" pytest -m "not slow"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

  integration:
    name: integration (real checkpoint)
    # Downloads ~843MB of model weights, so it is kept off the per-push path
    # and runs on demand and on the weekly schedule instead.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes, so the token need not outlive the checkout step.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache Laya checkpoints
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-english
          restore-keys: huggingface-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests against a real checkpoint
        run: uv run pytest -m slow
